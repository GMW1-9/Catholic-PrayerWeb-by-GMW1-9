<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hail Mary</title>

<style>
  body {
    background: #6b6c6b;
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
  }

  h1, h3 {
    text-align: center;
    color: #fff;
  }

  /* Prayer box styling with proper centering and max-width */
  p.prayer-box {
    max-width: 500px;
    margin: 20px auto;
    padding: 30px;
    background: #3a4356;
    color: #fff;
    border-radius: 8px;
    text-align: center;
    line-height: 1.8;
    box-shadow: 0 0 20px rgba(0,229,255,.5);
  }

  /* Styling to make the buttons look nice on the screen */
  .btn {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
    margin: 5px;
  }

  .btn:hover {
    background-color: #0056b3;
  }

  /* PRINT RULES */
  @media print {
    /* Hide the buttons on the paper */
    .btn {
      display: none !important;
    }

    body {
      background: white;
      color: black;
    }

    p.prayer-box {
      background: none;
      color: black;
      box-shadow: none;
      max-height: 100vh; 
      overflow: hidden; /* Prevents spilling onto page 2 */
    }
  }

  /* Shrink the default printer margins to fit more on one page */
  @page {
    margin: 10mm; 
  }
</style>
</head>
<body>

<div style="text-align: center;">
  <button class="btn print-btn" onclick="window.print()">🖨 Print Page</button>
  <a href="https://gmw1-9.github.io/Catholic-PrayerWeb-by-GMW1-9/Hail-Mary.html" class="btn link-btn" target="_blank">Visit Hail Mary Page</a>
</div>
   
<h1>Hail Mary</h1>


<p class="prayer-box">
   Hail Mary,
  <br>Full of Grace,
  <br>The Lord is with thee.
  <br>Blessed art thou amongst women,
  <br>And blessed is the fruit of thy womb, Jesus.
  <br>Holy Mary, Mother of God,
  <br>Pray for us sinners,
  <br>Now and at the hour of our death.
  <br><br>Amen.
</p>

</body>
</html>
