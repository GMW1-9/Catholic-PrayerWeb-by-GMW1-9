  <script>
    const repoRoot = "/Catholic-PrayerWeb-by-GMW1-9/";
    const firebaseSwPath = `${repoRoot}firebase-messaging-sw.js`;

    async function setupFirebaseMessaging() {
      if (!("serviceWorker" in navigator)) {
        console.warn("Service workers are not supported in this browser.");
        return;
      }

      if (!window.isSecureContext && location.hostname !== "localhost") {
        console.warn("Push notifications require HTTPS or localhost.");
        return;
      }

      try {
        const registration = await navigator.serviceWorker.register(firebaseSwPath, {
          scope: repoRoot
        });
        console.log("Firebase messaging service worker registered:", registration);
      } catch (error) {
        console.error("Firebase messaging service worker registration failed:", error);
      }
    }

    window.addEventListener("load", setupFirebaseMessaging);
  </script>
